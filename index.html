<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>งานรถทอย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f4f0;--surface:#fff;--ink:#1c1c1e;--muted:#67676d;--line:#e3e1db;--accent:#c8141c;--accent-ink:#fff;--chip:#eeece6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121214;--surface:#1d1d20;--ink:#f1f1f3;--muted:#a2a2aa;--line:#2f2f34;--accent:#ff4b53;--accent-ink:#1a0001;--chip:#29292d}}
:root[data-theme="dark"]{--bg:#121214;--surface:#1d1d20;--ink:#f1f1f3;--muted:#a2a2aa;--line:#2f2f34;--accent:#ff4b53;--accent-ink:#1a0001;--chip:#29292d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai","Sarabun","Leelawadee UI","Noto Sans Thai",system-ui,sans-serif;font-size:17px;line-height:1.55}
a{color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{margin:4px 0 2px;font-size:24px;line-height:1.3}
.sub{margin:0 0 16px;color:var(--muted);font-size:14px}

.card{display:block;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 12px}
.card b{display:block;font-size:19px}
.card span{display:block;color:var(--muted);font-size:15px;margin-top:2px}
.tip{background:var(--chip);border-radius:12px;padding:12px 14px;font-size:15px;color:var(--muted)}

</style>
</head>
<body>
<div class="wrap">
  <h1>งานรถทอย</h1>
  <p class="sub">เครื่องมือส่วนตัวสำหรับรายงานในกลุ่ม LINE</p>
  <a class="card" href="report.html"><b>รายงานรถทอย</b><span>ขึ้นของ / ลงของ · คืนรถก่อนเลิกกะ · คัดลอกข้อความไปวางใน LINE</span></a>
  <a class="card" href="map.html"><b>ผังช่องจอด 2 อาคาร</b><span>ผังจากภาพดาวเทียม พร้อมเลขช่องที่ใส่แล้ว</span></a>
  <p class="tip">เปิดในมือถือแล้วกด "แชร์" → "เพิ่มลงในหน้าจอหลัก" จะได้ไอคอนไว้กดเปิดเหมือนแอป</p>
</div>
</body>
</html>
