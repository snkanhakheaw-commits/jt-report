<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ผังช่องจอด 2 อาคาร</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f4f0;--surface:#fff;--ink:#1c1c1e;--muted:#67676d;--line:#e3e1db;--accent:#c8141c;--accent-ink:#fff;--chip:#eeece6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121214;--surface:#1d1d20;--ink:#f1f1f3;--muted:#a2a2aa;--line:#2f2f34;--accent:#ff4b53;--accent-ink:#1a0001;--chip:#29292d}}
:root[data-theme="dark"]{--bg:#121214;--surface:#1d1d20;--ink:#f1f1f3;--muted:#a2a2aa;--line:#2f2f34;--accent:#ff4b53;--accent-ink:#1a0001;--chip:#29292d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai","Sarabun","Leelawadee UI","Noto Sans Thai",system-ui,sans-serif;font-size:17px;line-height:1.55}
a{color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{margin:4px 0 2px;font-size:24px;line-height:1.3}
.sub{margin:0 0 16px;color:var(--muted);font-size:14px}

.btns{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:12px;
  border:1px solid var(--line);background:var(--chip);font:inherit;font-weight:600;text-decoration:none;cursor:pointer;color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.viewer{overflow:auto;-webkit-overflow-scrolling:touch;background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.viewer img{display:block;width:100%;max-width:1400px;height:auto;margin:0 auto}
.viewer.zoom img{width:320%;max-width:none}
.note{color:var(--muted);font-size:14px;margin:12px 0 0}

</style>
</head>
<body>
<div class="wrap">
  <h1>ผังช่องจอด 2 อาคาร</h1>
  <p class="sub">แตะปุ่ม "ขยาย" ของอาคารที่ต้องการ แล้วเลื่อนดูเลขช่อง หรือใช้สองนิ้วซูม</p>
  <div class="btns">
    <!-- data-x/y = ตำแหน่งแถวช่องจอดบนผัง (สัดส่วนของความกว้าง/สูงภาพ) -->
    <button type="button" class="btn primary zoomTo" data-x="0.66" data-y="0.50">ขยาย: อาคาร 2 ด้านใต้</button>
    <button type="button" class="btn primary zoomTo" data-x="0.27" data-y="0.40">ขยาย: อาคาร 1 ด้านตะวันออก</button>
    <button type="button" class="btn" id="fitBtn" hidden>ย่อ</button>
    <a class="btn" href="plan.svg">เปิดภาพเต็ม</a>
    <a class="btn" href="report.html">รายงานรถทอย</a>
  </div>
</div>
<div class="viewer" id="viewer"><img src="plan.svg" alt="ผังอาคาร 1 และอาคาร 2 พร้อมช่องจอดด้านใต้อาคาร 2 และด้านตะวันออกอาคาร 1"></div>
<div class="wrap"><p class="note">เลขช่องซ้ำได้ แยกด้วยสีพื้น (เหลือง / ขาว) · ช่องวางเรียงเท่า ๆ กัน ตำแหน่งจริงอาจคลาดเล็กน้อย</p></div>
<script>
const v = document.getElementById("viewer"), fit = document.getElementById("fitBtn");
document.querySelectorAll(".zoomTo").forEach(b => b.onclick = () => {
  v.classList.add("zoom");
  fit.hidden = false;
  const img = v.querySelector("img");
  requestAnimationFrame(() => {
    v.scrollLeft = img.clientWidth * +b.dataset.x - v.clientWidth / 2;
    window.scrollTo({top: v.offsetTop + img.clientHeight * +b.dataset.y - innerHeight / 2});
  });
});
fit.onclick = () => { v.classList.remove("zoom"); fit.hidden = true; };
</script>
</body>
</html>
